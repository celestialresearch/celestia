name: CodeQL Analysis

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: '17 3 * * 3'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: codeql-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  classify:
    name: Classify Changes
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      full: ${{ steps.changes.outputs.full }}
      ci: ${{ steps.changes.outputs.ci }}
      go: ${{ steps.changes.outputs.go }}
      rust: ${{ steps.changes.outputs.rust }}
    steps:
      - name: Checkout Repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Classify
        id: changes
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.sha }}
        run: bash ./.github/scripts/changecheck.sh "$BASE_SHA" "$HEAD_SHA" >>"$GITHUB_OUTPUT"

  analyze:
    name: Analyze (${{ matrix.language }})
    needs: classify
    permissions:
      contents: read
      security-events: write
    if: >-
      needs.classify.outputs.full == 'true' ||
      needs.classify.outputs.ci == 'true' ||
      needs.classify.outputs.go == 'true' ||
      needs.classify.outputs.rust == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - language: actions
            build-mode: none
          - language: go
            build-mode: autobuild
          - language: rust
            build-mode: none
    steps:
      - name: Checkout Repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Detect Language
        id: detect
        shell: bash
        env:
          LANGUAGE: ${{ matrix.language }}
        run: |
          case "$LANGUAGE" in
            actions)
              if ! detected=$(find .github/workflows -type f \( -name '*.yml' -o -name '*.yaml' \) -print); then
                exit 1
              fi
              ;;
            go)
              if ! detected=$(find . -type f -name '*.go' -print); then
                exit 1
              fi
              ;;
            rust)
              if ! detected=$(find . -type f -name '*.rs' -print); then
                exit 1
              fi
              ;;
            *)
              echo "unsupported CodeQL language: $LANGUAGE" >&2
              exit 1
          esac
          if [[ -n "$detected" ]]; then
            echo 'present=true' >>"$GITHUB_OUTPUT"
          else
            echo 'present=false' >>"$GITHUB_OUTPUT"
          fi
      - name: Init CodeQL
        if: steps.detect.outputs.present == 'true'
        uses: github/codeql-action/init@e4fba868fa4b1b91e1fdab776edc8cfbe6e9fb81 # v4.37.3
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}
          config-file: ./.github/codeql/codeql-config.yml
      - name: Analyze
        if: steps.detect.outputs.present == 'true'
        uses: github/codeql-action/analyze@e4fba868fa4b1b91e1fdab776edc8cfbe6e9fb81 # v4.37.3
        with:
          category: /language:${{ matrix.language }}
