name: Compatibility Verification

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: compatibility-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  classify:
    name: Classify Changes
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      full: ${{ steps.changes.outputs.full }}
      compatibility: ${{ steps.changes.outputs.compatibility }}
    steps:
      - name: Checkout Repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Classify
        id: changes
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.sha }}
        run: bash ./.github/scripts/changecheck.sh "$BASE_SHA" "$HEAD_SHA" >>"$GITHUB_OUTPUT"

  windows-shells:
    name: Windows Shells
    needs: classify
    if: >-
      needs.classify.outputs.full == 'true' ||
      needs.classify.outputs.compatibility == 'true'
    runs-on: windows-2025
    timeout-minutes: 30
    steps:
      - name: Checkout Repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: Setup MSYS2
        uses: msys2/setup-msys2@66cd2cce69caa17b53920067426061ca1de3a884 # v2.32.0
        with:
          msystem: UCRT64
          path-type: inherit
      - name: Setup Cygwin
        uses: cygwin/cygwin-install-action@3f0a3f9f988f7e96b8c18098ae05eaec175f5b52 # v6.0.2
        with:
          packages: git
      - name: Verify Windows Shells
        shell: pwsh
        run: ./.github/scripts/windows-shellcheck.ps1

  plan9-compile:
    name: Plan 9 AMD64 Compile
    needs: classify
    if: >-
      needs.classify.outputs.full == 'true' ||
      needs.classify.outputs.compatibility == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout Repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: Compile
        shell: bash
        env:
          CGO_ENABLED: '0'
          GOARCH: amd64
          GOOS: plan9
          GOTOOLCHAIN: local
        run: |
          go build ./...
          go test -c -o "$RUNNER_TEMP/attemptstore-plan9.test" \
            ./internal/attemptstore

  bsd-bootstrap:
    name: ${{ matrix.name }} ${{ matrix.version }} Guest Bootstrap
    needs: classify
    if: >-
      needs.classify.outputs.full == 'true' ||
      needs.classify.outputs.compatibility == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: FreeBSD
            operating-system: freebsd
            version: '15.1'
          - name: OpenBSD
            operating-system: openbsd
            version: '7.9'
          - name: NetBSD
            operating-system: netbsd
            version: '10.1'
          - name: DragonFly BSD
            operating-system: dragonflybsd
            version: '6.4.2'
    steps:
      - name: Checkout Repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Stage DragonFly CA Bundle
        if: matrix.operating-system == 'dragonflybsd'
        run: |
          install -D -m 0644 \
            /etc/ssl/certs/ca-certificates.crt \
            .github/generated/dragonfly-ca.pem
      - name: Start ${{ matrix.name }}
        uses: cross-platform-actions/action@5ea7e8e4677bd726033a10b094ba1c5762b15dee # v1.3.0
        with:
          operating_system: ${{ matrix.operating-system }}
          architecture: x86-64
          version: ${{ matrix.version }}
          shell: bash
          cpu_count: 2
          memory: 4G
      - name: Verify Guest
        shell: cpa.sh {0}
        run: |
          uname -a
          command -v bash
          test -f go.mod
          if ! detected=$(find . -type f -name '*.go' -print); then
            echo 'Go package inventory failed' >&2
            exit 1
          fi
          if [[ -z "$detected" ]]; then
            echo 'No Go packages exist'
            exit
          fi
          if ! command -v go >/dev/null 2>&1; then
            case "$(uname -s)" in
              FreeBSD)
                sudo pkg install -y go
                ;;
              NetBSD)
                sudo pkgin -y install go pkg_alternatives
                ;;
              OpenBSD)
                sudo pkg_add go
                ;;
              DragonFly)
                bash ./.github/scripts/dragonfly-bootstrap.sh
                ;;
              *)
                echo 'Go source exists but the guest has no Go toolchain' >&2
                exit 1
                ;;
            esac
          fi
          export GOTOOLCHAIN=go1.26.5+auto
          test "$(go env GOVERSION)" = go1.26.5
          go test -count=1 ./...
