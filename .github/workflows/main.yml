name: Change Verification

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: change-verification-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  classify:
    name: Classify Changes
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      full: ${{ steps.changes.outputs.full }}
      ci: ${{ steps.changes.outputs.ci }}
      go: ${{ steps.changes.outputs.go }}
      rust: ${{ steps.changes.outputs.rust }}
      dependencies: ${{ steps.changes.outputs.dependencies }}
      compatibility: ${{ steps.changes.outputs.compatibility }}
    steps:
      - name: Checkout Repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Classify
        id: changes
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.sha }}
        run: bash ./.github/scripts/changecheck.sh "$BASE_SHA" "$HEAD_SHA" >>"$GITHUB_OUTPUT"

  verify:
    name: Verify (${{ matrix.name }})
    needs: classify
    if: >-
      needs.classify.outputs.full == 'true' ||
      needs.classify.outputs.go == 'true' ||
      needs.classify.outputs.rust == 'true' ||
      needs.classify.outputs.dependencies == 'true' ||
      needs.classify.outputs.compatibility == 'true'
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux AMD64
            runner: ubuntu-24.04
            currency: 'true'
            supply-chain: 'true'
            go-flags: ''
          - name: Linux ARM64
            runner: ubuntu-24.04-arm
            currency: 'false'
            supply-chain: 'false'
            go-flags: ''
          - name: Windows AMD64
            runner: windows-2025
            currency: 'false'
            supply-chain: 'false'
            go-flags: -p=1
          - name: macOS ARM64
            runner: macos-15
            currency: 'false'
            supply-chain: 'false'
            go-flags: ''
          - name: macOS Intel
            runner: macos-15-intel
            currency: 'false'
            supply-chain: 'false'
            go-flags: ''
    steps:
      - name: Checkout Repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - name: Setup Rust
        uses: taiki-e/install-action@065d6a08a14e61e89fb0a4c10eecdbdef39c7d8e # v2.85.4
        with:
          tool: |
            rust@1.97.1 + rustfmt + clippy + llvm-tools-preview
            cargo-llvm-cov@0.8.7
      - name: Setup Rust Security
        if: matrix.supply-chain == 'true'
        uses: taiki-e/install-action@065d6a08a14e61e89fb0a4c10eecdbdef39c7d8e # v2.85.4
        with:
          tool: |
            cargo-audit@0.22.2
            cargo-deny@0.20.2
      - name: Verify
        shell: bash
        env:
          DEVCHECK_CURRENCY: ${{ matrix.currency }}
          DEVCHECK_OUTPUT: failed
          DEVCHECK_SUPPLY_CHAIN: ${{ matrix.supply-chain }}
          GOFLAGS: ${{ matrix.go-flags }}
        run: bash ./.github/scripts/devcheck.sh

  verify-bounded:
    name: Verify (Bounded)
    needs: classify
    if: >-
      needs.classify.outputs.full != 'true' &&
      needs.classify.outputs.go != 'true' &&
      needs.classify.outputs.rust != 'true' &&
      needs.classify.outputs.dependencies != 'true' &&
      needs.classify.outputs.compatibility != 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout Repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - name: Verify
        shell: bash
        env:
          DEVCHECK_CURRENCY: 'false'
          DEVCHECK_OUTPUT: failed
          DEVCHECK_PROFILE: shell
        run: bash ./.github/scripts/devcheck.sh

  dependency-review:
    name: Dependency Review
    needs: classify
    if: >-
      github.event_name == 'pull_request' &&
      (needs.classify.outputs.full == 'true' ||
      needs.classify.outputs.dependencies == 'true')
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout Repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Review Dependencies
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: moderate
