name: Change Verification

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: change-verification-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  classify:
    name: Classify Changes
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      full: ${{ steps.changes.outputs.full }}
      ci: ${{ steps.changes.outputs.ci }}
      go: ${{ steps.changes.outputs.go }}
      rust: ${{ steps.changes.outputs.rust }}
      dependencies: ${{ steps.changes.outputs.dependencies }}
      compatibility: ${{ steps.changes.outputs.compatibility }}
    steps:
      - name: Checkout Repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Classify
        id: changes
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.sha }}
        run: bash ./.github/scripts/changecheck.sh "$BASE_SHA" "$HEAD_SHA" >>"$GITHUB_OUTPUT"

  verify:
    name: Verify (${{ matrix.name }})
    needs: classify
    if: >-
      needs.classify.outputs.full == 'true' ||
      needs.classify.outputs.go == 'true' ||
      needs.classify.outputs.rust == 'true' ||
      needs.classify.outputs.dependencies == 'true' ||
      needs.classify.outputs.compatibility == 'true'
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux AMD64
            runner: ubuntu-24.04
            currency: 'true'
            platform-lint: 'true'
            supply-chain: 'true'
            go-flags: ''
          - name: Linux ARM64
            runner: ubuntu-24.04-arm
            currency: 'false'
            platform-lint: 'false'
            supply-chain: 'false'
            go-flags: ''
          - name: Windows AMD64
            runner: windows-2025
            currency: 'false'
            platform-lint: 'false'
            supply-chain: 'false'
            go-flags: -p=1
          - name: macOS ARM64
            runner: macos-15
            currency: 'false'
            platform-lint: 'false'
            supply-chain: 'false'
            go-flags: ''
          - name: macOS Intel
            runner: macos-15-intel
            currency: 'false'
            platform-lint: 'false'
            supply-chain: 'false'
            go-flags: ''
    steps:
      - name: Checkout Repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - name: Setup Rust
        uses: taiki-e/install-action@7f4eb899022d8fe70b20c4f3de697aa85c309026 # v2.85.11
        with:
          tool: |
            rust@1.97.1 + rustfmt + clippy + llvm-tools-preview
            cargo-llvm-cov@0.8.7
      - name: Setup Rust Security
        if: matrix.supply-chain == 'true'
        uses: taiki-e/install-action@7f4eb899022d8fe70b20c4f3de697aa85c309026 # v2.85.11
        with:
          tool: |
            cargo-audit@0.22.2
            cargo-deny@0.20.2
      - name: Setup Linux Qualification
        if: matrix.name == 'Linux AMD64'
        shell: bash
        run: |
          set -euo pipefail
          rustup target add x86_64-unknown-linux-musl
          cargo build --release --locked \
            --target x86_64-unknown-linux-musl \
            --manifest-path worker/qualification-fixtures/Cargo.toml \
            --bin celestia-hostile-worker
          built=$PWD/worker/qualification-fixtures/target/x86_64-unknown-linux-musl/release/celestia-hostile-worker
          test -x "$built"
          fixture_dir=$(mktemp -d "$RUNNER_TEMP/celestia-hostile.XXXXXX")
          printf 'CELESTIA_HOSTILE_FIXTURE_DIR=%s\n' "$fixture_dir" >>"$GITHUB_ENV"
          fixture=$fixture_dir/celestia-hostile-worker
          install -m 0500 "$built" "$fixture"
          test "$(stat -c %u "$fixture")" = "$(id -u)"
          test "$(stat -c %h "$fixture")" = 1
          test "$(stat -c %a "$fixture")" = 500
          printf 'CELESTIA_HOSTILE_FIXTURE=%s\n' "$fixture" >>"$GITHUB_ENV"
          evidence_root=$(mktemp -d "$RUNNER_TEMP/celestia-evidence.XXXXXX")
          printf 'CELESTIA_EVIDENCE_ROOT=%s\n' "$evidence_root" >>"$GITHUB_ENV"
          filesystem=$(findmnt -n -o FSTYPE --target "$evidence_root")
          case $filesystem in
            ext4|xfs) ;;
            *) printf 'Unsupported evidence filesystem: %s\n' "$filesystem" >&2; exit 1 ;;
          esac
          printf 'CELESTIA_EVIDENCE_FILESYSTEM=%s\n' "$filesystem" >>"$GITHUB_ENV"
          unit=celestia-qualification-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}
          sudo systemd-run --quiet --unit="$unit" --property=Delegate=yes \
            --property=DelegateSubgroup=keeper \
            --service-type=exec --uid="$(id -u)" sleep infinity
          printf 'CELESTIA_CGROUP_UNIT=%s\n' "$unit" >>"$GITHUB_ENV"
          group=$(systemctl show --property=ControlGroup --value "$unit")
          test -n "$group"
          root="/sys/fs/cgroup$group"
          printf '+cpu +memory +pids\n' >"$root/cgroup.subtree_control"
          grep -qw cpu "$root/cgroup.subtree_control"
          grep -qw memory "$root/cgroup.subtree_control"
          grep -qw pids "$root/cgroup.subtree_control"
          driver="$root/driver"
          mkdir "$driver"
          printf 'CELESTIA_CGROUP_ROOT=%s\n' "$root" >>"$GITHUB_ENV"
          printf 'CELESTIA_CGROUP_DRIVER=%s\n' "$driver" >>"$GITHUB_ENV"
          restriction=/proc/sys/kernel/apparmor_restrict_unprivileged_userns
          if [[ -e $restriction ]]; then
            original=$(<"$restriction")
            printf 'CELESTIA_USERNS_RESTRICTION=%s\n' "$original" >>"$GITHUB_ENV"
            if [[ $original != 0 ]]; then
              sudo sysctl -q -w kernel.apparmor_restrict_unprivileged_userns=0
            fi
          fi
      - name: Qualify Linux Placement
        if: matrix.name == 'Linux AMD64'
        shell: bash
        run: |
          test -n "$CELESTIA_CGROUP_ROOT"
          test -d "$CELESTIA_CGROUP_DRIVER"
          test -x "$CELESTIA_HOSTILE_FIXTURE"
          printf '%s\n' "$$" | sudo tee "$CELESTIA_CGROUP_DRIVER/cgroup.procs" >/dev/null
          go test -count=1 \
            -run '^(TestClone3CgroupPrimitiveNative|TestClone3BootstrapNative|TestLinuxHostileFixtureNative)$' \
            ./internal/linuxamd64feasibility
      - name: Qualify Linux Persistence
        if: matrix.name == 'Linux AMD64'
        shell: bash
        env:
          TMPDIR: ${{ env.CELESTIA_EVIDENCE_ROOT }}
        run: |
          test -n "$CELESTIA_EVIDENCE_ROOT"
          test -d "$CELESTIA_EVIDENCE_ROOT"
          case $CELESTIA_EVIDENCE_FILESYSTEM in ext4|xfs) ;; *) exit 1 ;; esac
          go test -count=1 \
            -run '^(TestLinuxPublicationDoesNotReplace|TestLinuxPublicationMovesExactEntry|TestLinuxAttemptLockExcludesSecondOwner|TestStorePublishesAndInspects|TestStoreRecoversPendingAttempt|TestRecoverRejectsActiveAttempt|TestReleasedAttemptCannotPublish|TestAttemptLockCrossProcess|TestRecoverAfterOwnerProcessDeath|TestRecoverAfterTerminalPublicationCrashPoints|TestRecoverCleansUncommittedCrashPoints)$' \
            ./internal/operation/urlreference/attempt
      - name: Verify
        shell: bash
        env:
          DEVCHECK_CURRENCY: ${{ matrix.currency }}
          DEVCHECK_GO_CAMPAIGN: 'false'
          DEVCHECK_OUTPUT: failed
          DEVCHECK_PLATFORM_LINT: ${{ matrix.platform-lint }}
          DEVCHECK_PROFILE: ${{ needs.classify.outputs.full == 'true' && 'full' || 'quick' }}
          DEVCHECK_SELF_TEST: 'false'
          DEVCHECK_SUPPLY_CHAIN: ${{ matrix.supply-chain }}
          GOFLAGS: ${{ matrix.go-flags }}
        run: |
          if [[ -n ${CELESTIA_CGROUP_DRIVER:-} ]]; then
            printf '%s\n' "$$" | sudo tee "$CELESTIA_CGROUP_DRIVER/cgroup.procs" >/dev/null
          fi
          bash ./.github/scripts/devcheck.sh
      - name: Cleanup Linux Qualification
        if: always() && matrix.name == 'Linux AMD64'
        shell: bash
        run: |
          status=0
          if [[ -n ${CELESTIA_CGROUP_UNIT:-} ]]; then
            sudo systemctl stop "$CELESTIA_CGROUP_UNIT" || status=$?
          fi
          if [[ -n ${CELESTIA_USERNS_RESTRICTION:-} ]]; then
            sudo sysctl -q -w \
              kernel.apparmor_restrict_unprivileged_userns="$CELESTIA_USERNS_RESTRICTION" || status=$?
          fi
          if [[ -n ${CELESTIA_HOSTILE_FIXTURE_DIR:-} ]]; then
            case $CELESTIA_HOSTILE_FIXTURE_DIR in
              "$RUNNER_TEMP"/celestia-hostile.*)
                rm -f -- "$CELESTIA_HOSTILE_FIXTURE_DIR/celestia-hostile-worker" || status=$?
                rmdir -- "$CELESTIA_HOSTILE_FIXTURE_DIR" || status=$?
                ;;
              *) status=1 ;;
            esac
          fi
          if [[ -n ${CELESTIA_EVIDENCE_ROOT:-} ]]; then
            case $CELESTIA_EVIDENCE_ROOT in
              "$RUNNER_TEMP"/celestia-evidence.*)
                rmdir -- "$CELESTIA_EVIDENCE_ROOT" || status=$?
                ;;
              *) status=1 ;;
            esac
          fi
          exit "$status"

  go-campaign:
    name: Go Campaign (${{ matrix.name }})
    needs: classify
    if: needs.classify.outputs.full == 'true'
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux AMD64
            runner: ubuntu-24.04
            go-flags: ''
          - name: Linux ARM64
            runner: ubuntu-24.04-arm
            go-flags: ''
          - name: Windows AMD64
            runner: windows-2025
            go-flags: -p=1
          - name: macOS ARM64
            runner: macos-15
            go-flags: ''
          - name: macOS Intel
            runner: macos-15-intel
            go-flags: ''
    steps:
      - name: Checkout Repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - name: Setup Rust
        uses: taiki-e/install-action@7f4eb899022d8fe70b20c4f3de697aa85c309026 # v2.85.11
        with:
          tool: rust@1.97.1
      - name: Verify Race
        shell: bash
        env:
          GOFLAGS: ${{ matrix.go-flags }}
        run: bash ./.github/scripts/testcheck.sh go race
      - name: Verify Fuzz
        shell: bash
        env:
          GOFLAGS: ${{ matrix.go-flags }}
        run: bash ./.github/scripts/testcheck.sh go fuzz

  verification-scripts:
    name: Verification Scripts
    needs: classify
    if: needs.classify.outputs.full == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout Repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - name: Setup Rust
        uses: taiki-e/install-action@7f4eb899022d8fe70b20c4f3de697aa85c309026 # v2.85.11
        with:
          tool: |
            rust@1.97.1 + rustfmt + clippy + llvm-tools-preview
            cargo-llvm-cov@0.8.7
      - name: Verify
        shell: bash
        run: bash ./.github/scripts/verification_test.sh

  verify-bounded:
    name: Verify (Bounded)
    needs: classify
    if: >-
      needs.classify.outputs.full != 'true' &&
      needs.classify.outputs.go != 'true' &&
      needs.classify.outputs.rust != 'true' &&
      needs.classify.outputs.dependencies != 'true' &&
      needs.classify.outputs.compatibility != 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout Repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - name: Verify
        shell: bash
        env:
          DEVCHECK_CURRENCY: 'false'
          DEVCHECK_OUTPUT: failed
          DEVCHECK_PROFILE: shell
          DEVCHECK_SELF_TEST: 'false'
        run: bash ./.github/scripts/devcheck.sh

  dependency-review:
    name: Dependency Review
    needs: classify
    if: >-
      github.event_name == 'pull_request' &&
      (needs.classify.outputs.full == 'true' ||
      needs.classify.outputs.dependencies == 'true')
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout Repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Review Dependencies
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: moderate
