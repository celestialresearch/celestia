name: Extended Verification

on:
  schedule:
    - cron: '41 4 * * 6'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: extended-verification
  cancel-in-progress: false

jobs:
  uncached:
    name: Uncached Verification
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - name: Checkout Repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false
      - name: Check Currency
        run: |
          bash ./.github/scripts/modcheck.sh diff
          bash ./.github/scripts/actioncheck.sh currency
      - name: Verify
        env:
          DEVCHECK_CURRENCY: 'false'
          DEVCHECK_OUTPUT: failed
        run: bash ./.github/scripts/devcheck.sh
