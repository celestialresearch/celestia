version: "2"

formatters:
  enable:
    - gofmt

linters:
  settings:
    cyclop:
      max-complexity: 12
      package-average: 0.0
    depguard:
      rules:
        production-boundaries:
          list-mode: lax
          deny:
            - pkg: "celestia.research/assurance"
              desc: Production must not import Assurance
            - pkg: "celestia.research/celestia/tools"
              desc: Production runtime must not import repository tools
            - pkg: "celestia.research/celestia/worker"
              desc: Production runtime must not import worker source
        execution-boundary:
          list-mode: lax
          files:
            - "**/internal/execution/**/*.go"
            - "**/internal/execution/supervision/*.go"
            - "**/internal/execution/supervision/**/*.go"
            - "!**/internal/execution/supervision/supervisor_windows_test.go"
          deny:
            - pkg: "celestia.research/celestia/internal/operation"
              desc: execution packages must not import operations
            - pkg: "celestia.research/celestia/internal/urloperation"
              desc: execution packages must not import operation packages
        execution-integration:
          list-mode: lax
          files:
            - "**/internal/execution/supervision/supervisor_windows_test.go"
          allow:
            - "celestia.research/celestia/internal/execution/supervision"
            - "celestia.research/celestia/internal/urladmission"
            - "celestia.research/celestia/internal/operation/urlreference/transform"
            - "celestia.research/celestia/internal/workerprotocolv1"
          deny:
            - pkg: "celestia.research/celestia/internal"
              desc: supervision qualification test imports only declared dependencies
        command-boundary:
          list-mode: lax
          files:
            - "**/cmd/**/*.go"
          allow:
            - "celestia.research/celestia/internal/operation/urlreference$"
          deny:
            - pkg: "celestia.research/celestia/internal/operation"
              desc: commands import declared operation roots only
        url-reference-operation:
          list-mode: lax
          files:
            - "**/internal/operation/urlreference/*.go"
            - "**/internal/urloperation/*.go"
          allow:
            - "celestia.research/celestia/internal/operation/urlreference/admission"
            - "celestia.research/celestia/internal/operation/urlreference/attempt"
            - "celestia.research/celestia/internal/operation/urlreference/protocol"
            - "celestia.research/celestia/internal/operation/urlreference/transform"
            - "celestia.research/celestia/internal/attemptstore"
            - "celestia.research/celestia/internal/execution/supervision"
            - "celestia.research/celestia/internal/urladmission"
            - "celestia.research/celestia/internal/operation/urlreference/transform"
            - "celestia.research/celestia/internal/workerprotocolv1"
          deny:
            - pkg: "celestia.research/celestia/internal/operation"
              desc: operation roots import only their own declared subpackages
        url-reference-attempt:
          list-mode: lax
          files:
            - "**/internal/operation/urlreference/attempt/*.go"
            - "**/internal/operation/urlreference/attempt/**/*.go"
            - "**/internal/attemptstore/*.go"
            - "**/internal/attemptstore/**/*.go"
          allow:
            - "celestia.research/celestia/internal/operation/urlreference/admission"
            - "celestia.research/celestia/internal/operation/urlreference/protocol"
            - "celestia.research/celestia/internal/operation/urlreference/transform"
            - "celestia.research/celestia/internal/urladmission"
            - "celestia.research/celestia/internal/operation/urlreference/transform"
            - "celestia.research/celestia/internal/workerprotocolv1"
          deny:
            - pkg: "celestia.research/celestia/internal"
              desc: attempt evidence imports only lower URL-reference owners
        url-reference-admission:
          list-mode: lax
          files:
            - "**/internal/operation/urlreference/admission/*.go"
            - "**/internal/operation/urlreference/admission/**/*.go"
            - "**/internal/urladmission/*.go"
            - "**/internal/urladmission/**/*.go"
          allow:
            - "celestia.research/celestia/internal/operation/urlreference/protocol"
            - "celestia.research/celestia/internal/operation/urlreference/transform"
            - "celestia.research/celestia/internal/operation/urlreference/transform"
            - "celestia.research/celestia/internal/workerprotocolv1"
          deny:
            - pkg: "celestia.research/celestia/internal"
              desc: admission imports only protocol and transformation
        url-reference-protocol:
          list-mode: lax
          files:
            - "**/internal/operation/urlreference/protocol/*.go"
            - "**/internal/operation/urlreference/protocol/**/*.go"
            - "**/internal/workerprotocolv1/*.go"
            - "**/internal/workerprotocolv1/**/*.go"
          allow:
            - "celestia.research/celestia/internal/operation/urlreference/transform"
            - "celestia.research/celestia/internal/operation/urlreference/transform"
          deny:
            - pkg: "celestia.research/celestia/internal"
              desc: protocol imports only transformation
        url-reference-transform:
          list-mode: lax
          files:
            - "**/internal/operation/urlreference/transform/*.go"
            - "**/internal/operation/urlreference/transform/**/*.go"
            - "**/internal/operation/urlreference/transform/*.go"
            - "**/internal/operation/urlreference/transform/**/*.go"
          deny:
            - pkg: "celestia.research/celestia/internal"
              desc: transformation must not import other Production internals
    errcheck:
      check-blank: true
      check-type-assertions: true
    funlen:
      lines: 80
      statements: 50
      ignore-comments: true
    misspell:
      mode: restricted
    nolintlint:
      require-explanation: true
      require-specific: true

  default: none
  enable:
    - govet
    - staticcheck
    - unused
    - errcheck
    - ineffassign

    - asciicheck
    - bodyclose
    - contextcheck
    - cyclop
    - durationcheck
    - depguard
    - errorlint
    - errchkjson
    - exhaustive
    - funlen
    - gochecksumtype
    - godox
    - makezero
    - misspell
    - modernize
    - noctx
    - nilerr
    - nilnil
    - nilnesserr
    - recvcheck
    - rowserrcheck
    - sqlclosecheck
    - unparam

    - bidichk
    - gosec
    - gomoddirectives
    - musttag
    - nolintlint

    - thelper
    - tparallel
    - usetesting
